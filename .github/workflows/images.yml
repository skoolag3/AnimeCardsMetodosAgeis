name: Build e publicacao das imagens
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {service: backend, context: backend, target: runtime}
          - {service: migrate, context: backend, target: migrate}
          - {service: frontend, context: frontend, target: runtime}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/skoolag3/animecardsmetodosageis-${{ matrix.service }}:latest
