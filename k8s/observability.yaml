apiVersion: apps/v1
kind: DaemonSet
metadata: {name: cadvisor, namespace: animecards}
spec:
  selector: {matchLabels: {app: cadvisor}}
  template:
    metadata: {labels: {app: cadvisor}}
    spec:
      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:v0.53.0
          securityContext: {privileged: true}
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: rootfs, mountPath: /rootfs, readOnly: true}
            - {name: varrun, mountPath: /var/run, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: docker, mountPath: /var/lib/docker, readOnly: true}
      volumes:
        - {name: rootfs, hostPath: {path: /}}
        - {name: varrun, hostPath: {path: /var/run}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: docker, hostPath: {path: /var/lib/docker, type: DirectoryOrCreate}}
---
apiVersion: v1
kind: Service
metadata: {name: cadvisor, namespace: animecards}
spec:
  selector: {app: cadvisor}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: animecards}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.3
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: animecards}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: animecards}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.1
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: animecards-secret, key: GRAFANA_ADMIN_PASSWORD}}
            - {name: GF_SMTP_ENABLED, value: 'true'}
            - {name: GF_SMTP_HOST, value: 'mailpit:1025'}
            - {name: GF_SMTP_FROM_ADDRESS, value: 'alertas@animecards.local'}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: provider.yml}
            - {name: dashboard, mountPath: /etc/grafana/provisioning/dashboards/json}
            - {name: alerts, mountPath: /etc/grafana/provisioning/alerting}
      volumes:
        - {name: datasource, configMap: {name: grafana-datasource}}
        - {name: provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboard, configMap: {name: grafana-dashboard}}
        - {name: alerts, configMap: {name: grafana-alerts}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: animecards}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30082}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailpit, namespace: animecards}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailpit}}
  template:
    metadata: {labels: {app: mailpit}}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27
          ports: [{containerPort: 1025}, {containerPort: 8025}]
---
apiVersion: v1
kind: Service
metadata: {name: mailpit, namespace: animecards}
spec:
  selector: {app: mailpit}
  ports: [{name: smtp, port: 1025, targetPort: 1025}, {name: web, port: 8025, targetPort: 8025}]
