apiVersion: batch/v1
kind: Job
metadata: {name: animecards-migrate, namespace: animecards}
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: aguardar-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U animecards -d animecards; do sleep 2; done"]
      containers:
        - name: migrate
          image: ghcr.io/skoolag3/animecardsmetodosageis-migrate:latest
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom: [{secretRef: {name: animecards-secret}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: animecards}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: ghcr.io/skoolag3/animecardsmetodosageis-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3001}]
          envFrom: [{secretRef: {name: animecards-secret}}]
          env: [{name: FRONTEND_URL, value: http://localhost:3000}]
          readinessProbe: {httpGet: {path: /health, port: 3001}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 3001}, initialDelaySeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: animecards}
spec:
  selector: {app: backend}
  ports: [{port: 3001, targetPort: 3001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: animecards}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/skoolag3/animecardsmetodosageis-frontend:latest
          ports: [{containerPort: 3000}]
          env: [{name: BACKEND_URL, value: http://backend:3001}]
          readinessProbe: {httpGet: {path: /, port: 3000}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: animecards}
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30080}]
